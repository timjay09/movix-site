<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="..." />
    <title>Movix OV - Bereikbaar. Voor iedereen.</title>
    <link rel="icon" href="favicon.png">
    <meta name="description" content="Te weinig bussen. Te laat. Of helemaal niet. Vertel ons hoe het OV in jouw regio écht is.">

    <meta property="og:title" content="Movix – Bereikbaar. Voor iedereen.">
    <meta property="og:description" content="Te weinig bussen. Te laat. Of helemaal niet. Vertel ons hoe het OV in jouw regio écht is.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.movix-ov.nl">
    <meta property="og:image" content="https://www.movix-ov.nl/og-movix.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        :root {
            --indigo: #3F51B5;
            --indigo-dark: #303F9F;
            --indigo-soft: #5C6BC0;
            --orange: #FF6E40;
            --orange-dark: #F4511E;
            --gold-soft: #ffd54f;
            --bg: #f5f6fb;
            --card: #ffffff;
            --text: #2e3342;
            --muted: #666d84;
            --line: #e3e8ff;
            --shadow: 0 12px 32px rgba(40, 53, 120, 0.12);
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #f8f9ff 0%, var(--bg) 180px);
            color: var(--text);
            line-height: 1.65;
        }

        .container {
            width: min(1120px, 92vw);
            margin: 0 auto;
        }

        .hero-wrap {
            background: linear-gradient(140deg, var(--indigo-dark) 0%, var(--indigo) 55%, var(--indigo-soft) 100%);
            color: white;
            border-radius: 0 0 28px 28px;
            box-shadow: 0 14px 34px rgba(48, 63, 159, 0.25);
            position: relative;
            overflow: hidden;
        }

        .hero-wrap::before,
        .hero-wrap::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .hero-wrap::before {
            width: 440px;
            height: 440px;
            right: -150px;
            top: -180px;
            background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 70%);
        }

        .hero-wrap::after {
            width: 360px;
            height: 360px;
            left: -140px;
            bottom: -210px;
            background: radial-gradient(circle, rgba(255,110,64,0.28) 0%, rgba(255,110,64,0) 70%);
        }

        .hero {
            min-height: 74vh;
            padding: 34px 0 72px;
            display: grid;
            align-content: center;
            gap: 16px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand img {
            width: 44px;
            height: 44px;
        }

        .brand-name {
            font-size: clamp(1.6rem, 2.3vw, 2.1rem);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .status-badge {
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            width: fit-content;
            margin-bottom: 4px;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1.1;
            max-width: 760px;
        }

        .hero p {
            max-width: 700px;
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            opacity: 0.94;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 6px;
        }

        .btn {
            text-decoration: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            padding: 13px 22px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 110, 64, 0.33);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: var(--orange-dark);
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.35) 46%, transparent 70%);
            transform: translateX(-140%);
            transition: transform 0.45s ease;
        }

        .btn:hover::after {
            transform: translateX(140%);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.14);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background: white;
            color: var(--indigo);
        }

        .main {
            margin-top: -26px;
            padding-bottom: 56px;
        }

        .section-label {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6f79a7;
            margin-bottom: 8px;
            background: #f2f4ff;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid #dce4ff;
        }

        .section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 18px;
            border: 1px solid #eef1ff;
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--indigo) 0%, var(--indigo-soft) 55%, var(--orange) 100%);
            opacity: 0.9;
        }

        .section h2 {
            color: var(--indigo);
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 10px;
            letter-spacing: 0.01em;
            position: relative;
            width: fit-content;
        }

        .section h2::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 52%;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--orange) 0%, rgba(255,110,64,0) 100%);
        }

        .lead {
            color: var(--muted);
            margin-bottom: 18px;
            max-width: 860px;
            font-size: 1.03rem;
        }

        .focus-intro {
            background: linear-gradient(180deg, #f2f4ff 0%, #edf0ff 100%);
            border: 1px solid var(--line);
            border-left: 4px solid var(--orange);
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 700;
            color: var(--indigo-dark);
            margin-bottom: 16px;
        }


        .focus-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .focus-card {
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(180deg, #f8f9ff 0%, #f2f5ff 100%);
            border: 1px solid var(--line);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            position: relative;
        }

        .focus-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 22px rgba(63, 81, 181, 0.16);
            border-color: #c8d5ff;
        }


        .focus-icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: white;
            border: 1px solid #d9e0ff;
            display: grid;
            place-items: center;
            font-size: 2rem;
            margin-bottom: 10px;
            box-shadow: 0 5px 14px rgba(63, 81, 181, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .focus-card:hover .focus-icon {
            transform: scale(1.07) rotate(-4deg);
            box-shadow: 0 8px 18px rgba(63, 81, 181, 0.2);
        }

        .focus-card h3 {
            color: var(--indigo);
            font-size: 1rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .focus-card p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .story-grid {
            display: flex;
            flex-direction: row;
            gap: 12px;
            margin-top: 10px;
        }

        .story-card {
            background: #f8f9ff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            flex: 1;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .story-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(63, 81, 181, 0.12);
        }

        .story-card h3 {
            font-size: 1.02rem;
            color: var(--indigo);
            margin-bottom: 6px;
        }

        .story-card p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.55;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .mini-card {
            background: #f8f9ff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .mini-card:hover {
            border-color: #c8d5ff;
            transform: translateY(-1px);
        }

        .mini-card strong {
            display: block;
            color: var(--indigo);
            margin-bottom: 4px;
        }

        .timeline {
            margin-top: 12px;
            display: grid;
            gap: 10px;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            align-items: start;
            background: #f8f9ff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .timeline-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(63, 81, 181, 0.1);
        }

        .timeline-phase {
            background: var(--indigo);
            color: white;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 8px;
            min-width: 58px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(63, 81, 181, 0.22);
        }

        .timeline-item h3 {
            color: var(--indigo);
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .timeline-item p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .faq-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .faq-item {
            background: #f8f9ff;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .faq-item:hover {
            border-color: #c8d5ff;
            box-shadow: 0 8px 16px rgba(63, 81, 181, 0.08);
        }

        .faq-item summary {
            cursor: pointer;
            list-style: none;
            color: var(--indigo);
            font-size: 1rem;
            font-weight: 700;
            padding: 12px;
        }

        .faq-item summary::-webkit-details-marker {
            display: none;
        }

        .faq-item summary::after {
            content: "+";
            float: right;
            font-size: 1.1rem;
            line-height: 1;
        }

        .faq-item[open] summary::after {
            content: "−";
        }

        .faq-answer {
            color: var(--muted);
            font-size: 0.95rem;
            padding: 0 12px 12px;
        }

        .section {
            animation: fadeInUp 0.5s ease both;
        }

        .section:nth-of-type(2) { animation-delay: 0.05s; }
        .section:nth-of-type(3) { animation-delay: 0.1s; }
        .section:nth-of-type(4) { animation-delay: 0.15s; }
        .section:nth-of-type(5) { animation-delay: 0.2s; }
        .section:nth-of-type(6) { animation-delay: 0.25s; }
        .section:nth-of-type(7) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .section {
                animation: none;
            }
            .btn::after {
                display: none;
            }
        }


        .cta-section {
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-soft) 100%);
            color: white;
            text-align: center;
            border: none;
        }

        .cta-section::before {
            background: linear-gradient(90deg, #ffffff 0%, var(--gold-soft) 50%, #ffffff 100%);
            opacity: 0.45;
        }

        .cta-section h2,
        .cta-section p {
            color: white;
        }

        .cta-section p {
            max-width: 860px;
            margin: 0 auto;
            opacity: 0.95;
        }

        footer {
            background: var(--indigo-dark);
            color: white;
            text-align: center;
            padding: 34px 20px;
        }

        footer p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        footer .footer-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        @media (max-width: 980px) {
            .focus-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .story-grid {
                flex-direction: column;
            }

            .mini-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 680px) {
            .hero {
                min-height: auto;
                padding-bottom: 58px;
            }

            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .cta-row {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .section {
                padding: 22px 18px;
            }

            .focus-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="hero-wrap">
        <div class="container hero">
            <div class="top-row">
                <a class="brand" href="#">
                    <img src="favicon.png" alt="Movix logo">
                    <span class="brand-name">Movix</span>
                </a>
            </div>
            <h1>Bereikbaar. Voor iedereen.</h1>
            <p>Er wordt momenteel hard gewerkt aan de site. Kom later terug of vul de enquête hier onder in! :)</p>

            <div class="cta-row">
                <a href="http://denkmee.movix-ov.nl" class="btn btn-primary">📝 Vul de enquête in</a>            </div>
        </div>
    </header>
